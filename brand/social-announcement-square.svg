<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="iVisual-Studio square social">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 H 0 V 64" fill="none" stroke="#38BDF8" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="540" cy="640" r="520">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="#05080E"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
