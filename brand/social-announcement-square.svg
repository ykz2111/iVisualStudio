  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="434" y="394"><tspan fill="#C4B5FD">if</tspan><tspan fill="#F4F9FD"> ! git clone</tspan></text>
    <text x="448" y="424"><tspan fill="#7DD3FC">echo</tspan><tspan fill="#6EE7B7"> "✗ Failed"</tspan></text>
    <text x="448" y="454"><tspan fill="#C4B5FD">exit</tspan><tspan fill="#FBBF24"> 1</tspan></text>
    <text x="434" y="484" fill="#C4B5FD">fi</text>
    <text x="434" y="544"><tspan fill="#7DD3FC">echo</tspan><tspan fill="#6EE7B7"> "✓ Done"</tspan></text>
    <text x="434" y="604" fill="#64748B"># Run installer</text>
  </g>

