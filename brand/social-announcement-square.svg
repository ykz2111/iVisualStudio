  <rect x="541" y="332" width="118" height="26" rx="8" fill="none" stroke="#38BDF8" stroke-opacity="0.25"/>
  <rect x="550" y="341" width="9" height="9" rx="1.5" fill="#7DD3FC" fill-opacity="0.8"/>
  <text x="565" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#9BB0C5">README.md</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#64748B" text-anchor="end">
